services:
  app:
    image: voice_analyzer:latest
    build: .
    ports:
      - "0.0.0.0:5090:3000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    environment:
      WHISPER_URL: http://whisper:8080/inference
    depends_on:
      whisper:
        condition: service_started # Запускаем приложение сразу, как только контейнер whisper стартует

  whisper:
    image: ghcr.io/ggml-org/whisper.cpp:main
    restart: unless-stopped
    # Используем прямую команду без вызова 'sh -c'.
    # Флаг --download-model автоматически скачает medium, если её нет в папке /models
    command:
      - whisper-server
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --language
      - ru
      - -t
      - "8"
      - --download-model
      - medium
      - -m
      - /models/ggml-medium.bin
    volumes:
      - whisper_models:/models # Добавляем volume, чтобы модель не скачивалась заново при каждом перезапуске

volumes:
  whisper_models: # Память на сервере для хранения весов нейросети